name: Release Android APK (v2.0.0)

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v2.0.0)'
        required: true
        default: 'v2.0.0'
      release_name:
        description: 'Release Title'
        required: true
        default: 'CineStream v2.0.0 - Major Update'

jobs:
  build-and-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Setup Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: 5. Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: 6. Build Web Assets
        run: npm run build

      - name: 7. Initialize & Sync Capacitor Android
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: 8. Configure Android Permissions & Gradle
        run: |
          MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_FILE" ]; then
            sed -i '/<application/ s/>/ android:usesCleartextTraffic="true" android:hardwareAccelerated="true">/' "$MANIFEST_FILE"
          fi

          cat << 'EOF' >> android/app/build.gradle

          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          EOF

          sed -i 's/versionCode 1/versionCode 2/g' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "2.0.0"/g' android/app/build.gradle

      - name: 9. Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug -x lint -x test -x check --no-daemon

      - name: 10. Rename APK Binary
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk CineStream-v2.0.0.apk

      - name: 11. Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CineStream-v2.0.0-APK
          path: CineStream-v2.0.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: 12. Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event.inputs.tag_name || 'v2.0.0' }}
          name: ${{ github.event.inputs.release_name || 'CineStream v2.0.0 - Major Update' }}
          body: |
            ### 🎬 CineStream v2.0.0 Update Changelog
            - **New Detail Page Architecture**: Rich backdrop views, rating tags, trailers, full cast, and story synopsis.
            - **TV Seasons & Episodes with Thumbnails**: Interactive season switcher with episode previews, numbers, and runtimes.
            - **Dedicated Fullscreen Video Player Screen**: Clean, distraction-free player with quick server switcher drawer.
            - **21 Streaming Servers**: High-speed embed servers including Max, VidPro, 4K, VidFast, VidCore, VidRock, 2Embed, CinemaOS, and more.
            - **Mobile Navigation**: Bottom navigation bar for rapid navigation between Home, Movies, TV Series, Genres, and Watchlist.
            - **Search Improvements**: Keystroke URL history pollution fixed for instantaneous 1-tap Back navigation.
          files: CineStream-v2.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
