name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 🔥 FIX 1: Accept Android licenses
      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
        continue-on-error: true

      # 🔥 FIX 2: Cache Gradle for faster builds
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      # 🔥 FIX 3: Remove || true and add error checking
      - name: Initialize and Sync Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init CineStream com.cinestream.app --web-dir dist
          npx cap add android  # REMOVED || true
          npx cap sync android

      # 🔥 FIX 4: Verify android folder exists before building
      - name: Verify Android project
        run: |
          if [ ! -d "android" ]; then
            echo "Error: Android folder not found!"
            exit 1
          fi
          if [ ! -f "android/gradlew" ]; then
            echo "Error: gradlew not found!"
            exit 1
          fi

      - name: Build Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CineStream-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # 🔥 FIX 5: Upload logs if build fails (optional)
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: android/build/outputs/logs/
