name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build & Export APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Setup Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 4. Install Node Packages
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps
          npm install -D @capacitor/cli @capacitor/core @capacitor/android

      - name: 5. Build Web Project (Vite)
        run: npm run build

      - name: 6. Setup and Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            echo "Adding Android platform..."
            npx cap add android
          fi
          echo "Syncing web assets..."
          npx cap sync android

      - name: 7. Build Debug APK using Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 8. Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CineStream-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
