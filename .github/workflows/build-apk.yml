name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build & Export APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 4. Setup Android SDK & Accept Licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | sdkmanager --licenses || true

      - name: 5. Install Dependencies & Capacitor CLI
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps
          npm install --save @capacitor/core @capacitor/android @capacitor/cli --legacy-peer-deps

      - name: 6. Build Web Project (Vite)
        run: npm run build

      - name: 7. Setup and Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            echo "Adding Android platform..."
            npx @capacitor/cli add android
          fi
          echo "Syncing web assets to Android..."
          npx @capacitor/cli sync android

      - name: 8. Build Debug APK using Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m"

      - name: 9. Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CineStream-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
