name: Build Android APK (v2.0.0)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name (e.g. 2.0.0)'
        required: false
        default: '2.0.0'
      version_code:
        description: 'Version Code (integer)'
        required: false
        default: '2'

jobs:
  build-apk:
    name: Build CineStream APK v2.0
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Setup Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: 5. Install Dependencies
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps
          npm install --save @capacitor/core @capacitor/android @capacitor/cli --legacy-peer-deps

      - name: 6. Build Web Assets (Vite)
        run: npm run build

      - name: 7. Initialize & Sync Capacitor Android
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: 8. Configure Android Permissions & Gradle
        run: |
          echo "Configuring Android permissions and versioning..."
          
          # Allow internet, cleartext network traffic, and fullscreen hardware acceleration
          MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_FILE" ]; then
            sed -i '/<application/ s/>/ android:usesCleartextTraffic="true" android:hardwareAccelerated="true">/' "$MANIFEST_FILE"
          fi

          # Gradle configuration: Exclude Kotlin duplicate classes & set version codes
          VERSION_NAME="${{ github.event.inputs.version_name || '2.0.0' }}"
          VERSION_CODE="${{ github.event.inputs.version_code || '2' }}"

          cat << 'EOF' >> android/app/build.gradle

          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          EOF

          # Update Version Code and Name in android/app/build.gradle
          sed -i "s/versionCode 1/versionCode $VERSION_CODE/g" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"$VERSION_NAME\"/g" android/app/build.gradle

      - name: 9. Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug -x lint -x test -x check --no-daemon --stacktrace

      - name: 10. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CineStream-v2.0.0-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
