name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Generate APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Setup Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: 5. Install NPM Packages
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps
          npm install --save @capacitor/core @capacitor/android @capacitor/cli --legacy-peer-deps

      - name: 6. Build Web Dist
        run: npm run build

      - name: 7. Init & Sync Capacitor Android
        run: |
          rm -rf android
          npx @capacitor/cli add android
          npx @capacitor/cli sync android

      - name: 8. Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug -x lint -x test -x check --no-daemon

      - name: 9. Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CineStream-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
